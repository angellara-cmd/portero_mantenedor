<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Estudio V2 — Portero/a-Mantenedor/a Ayto. Huelva</title>
<style>
  :root {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --surface-alt: #f8fafc;
    --text: #0f172a;
    --text-muted: #475569;
    --border: #e2e8f0;
    --primary: #004b87;
    --primary-light: #e0f2fe;
    --accent: #0284c7;
    --success: #15803d;
    --success-bg: #dcfce7;
    --danger: #b91c1c;
    --danger-bg: #fee2e2;
    --warn-bg: #fef3c7;
    --warn-border: #d97706;
    --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.08);
    --sidebar-w: 320px;
  }

  [data-theme="dark"] {
    --bg: #0b1120;
    --surface: #111827;
    --surface-alt: #1e293b;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #1e293b;
    --primary: #38bdf8;
    --primary-light: rgba(56, 189, 248, 0.14);
    --accent: #7dd3fc;
    --success: #4ade80;
    --success-bg: rgba(74, 222, 128, 0.15);
    --danger: #f87171;
    --danger-bg: rgba(248, 113, 113, 0.15);
    --warn-bg: rgba(217, 119, 6, 0.15);
    --warn-border: #f59e0b;
    --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    transition: background 0.2s, color 0.2s;
  }

  /* Topbar */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 62px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1rem;
    z-index: 200;
    box-shadow: 0 1px 6px rgba(0,0,0,0.05);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-weight: 700;
    font-size: 0.96rem;
    color: var(--primary);
  }
  .brand span.tag {
    background: var(--primary-light);
    color: var(--primary);
    font-size: 0.72rem;
    padding: 0.18rem 0.55rem;
    border-radius: 999px;
    font-weight: 700;
  }
  .top-actions { display: flex; align-items: center; gap: 0.45rem; }
  .icon-btn {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.42rem 0.72rem;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
  }
  .icon-btn:hover { border-color: var(--accent); }
  #menuBtn { display: none; }

  .read-progress {
    position: fixed;
    top: 62px; left: 0;
    height: 3px;
    background: var(--accent);
    width: 0%;
    z-index: 201;
  }

  .layout { display: flex; padding-top: 62px; min-height: 100vh; }

  /* Sidebar */
  aside.sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    position: fixed;
    top: 62px; bottom: 0; left: 0;
    overflow-y: auto;
    padding: 1rem 0.85rem 3.5rem;
    z-index: 150;
    transition: transform 0.25s ease;
  }
  .search-box {
    width: 100%;
    padding: 0.6rem 0.85rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--text);
    font-size: 0.86rem;
    margin-bottom: 0.8rem;
    outline: none;
  }
  .search-box:focus { border-color: var(--accent); }

  .progress-summary {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.65rem 0.8rem;
    margin-bottom: 0.85rem;
    font-size: 0.8rem;
  }
  .progress-bar-bg {
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 0.35rem;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--success);
    width: 0%;
    transition: width 0.3s ease;
  }

  .flashcards-nav-btn {
    width: 100%;
    text-align: left;
    background: linear-gradient(135deg, #004b87, #0284c7);
    color: #fff;
    border: none;
    border-radius: 9px;
    padding: 0.65rem 0.85rem;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(2, 132, 199, 0.25);
  }
  .flashcards-nav-btn.active {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .nav-group-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 700;
    margin: 0.9rem 0.5rem 0.35rem;
  }
  .nav-item {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.45rem;
    padding: 0.52rem 0.68rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.82rem;
    color: var(--text);
    margin-bottom: 0.2rem;
    border: 1px solid transparent;
  }
  .nav-item:hover { background: var(--surface-alt); }
  .nav-item.active {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 700;
    border-color: rgba(2, 132, 199, 0.25);
  }
  .nav-check { font-size: 0.75rem; color: var(--success); font-weight: 700; flex-shrink: 0; }

  /* Main */
  main.content {
    margin-left: var(--sidebar-w);
    flex: 1;
    padding: 1.5rem 1.4rem 5rem;
    max-width: 100%;
  }
  .article-wrap {
    max-width: 880px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 2rem 2.25rem;
    box-shadow: var(--shadow);
  }

  .tema-header {
    border-bottom: 2px solid var(--border);
    padding-bottom: 1rem;
    margin-bottom: 1.5rem;
  }
  .tema-meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.6rem;
  }
  .tema-badge {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 700;
    font-size: 0.78rem;
    padding: 0.25rem 0.7rem;
    border-radius: 999px;
  }
  .study-toggle {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.35rem 0.85rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .study-toggle.done {
    background: var(--success-bg);
    color: var(--success);
    border-color: var(--success);
  }
  h1.tema-title { margin: 0; font-size: 1.48rem; line-height: 1.3; color: var(--primary); }
  h2 {
    font-size: 1.15rem;
    color: var(--primary);
    margin-top: 1.85rem;
    margin-bottom: 0.75rem;
    padding-left: 0.7rem;
    border-left: 4px solid var(--accent);
  }
  h3 { font-size: 1.02rem; margin-top: 1.25rem; margin-bottom: 0.45rem; }
  p { margin: 0.55rem 0; }
  ul, ol { padding-left: 1.35rem; margin: 0.45rem 0 0.9rem; }
  li { margin-bottom: 0.4rem; }

  .callout {
    background: var(--surface-alt);
    border-left: 4px solid var(--accent);
    padding: 0.9rem 1.1rem;
    border-radius: 8px;
    margin: 1.15rem 0;
    font-size: 0.92rem;
  }
  .callout.exam { background: var(--warn-bg); border-left-color: var(--warn-border); }
  .callout-title { font-weight: 700; margin-bottom: 0.3rem; display: block; color: var(--primary); }
  .callout.exam .callout-title { color: var(--warn-border); }

  table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.88rem; }
  th, td { border: 1px solid var(--border); padding: 0.55rem 0.7rem; text-align: left; }
  th { background: var(--surface-alt); font-weight: 700; }

  /* Mini-test section */
  .minitest-box {
    margin-top: 2.5rem;
    padding: 1.4rem;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-top: 4px solid var(--primary);
    border-radius: 12px;
  }
  .minitest-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .minitest-header h3 { margin: 0; color: var(--primary); font-size: 1.1rem; }
  .mt-q {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 1rem;
    margin-bottom: 0.9rem;
  }
  .mt-q-text { font-weight: 600; font-size: 0.94rem; margin-bottom: 0.65rem; }
  .mt-opts { display: flex; flex-direction: column; gap: 0.4rem; }
  .mt-opt {
    display: flex;
    align-items: flex-start;
    gap: 0.55rem;
    padding: 0.55rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    font-size: 0.9rem;
    background: var(--surface);
  }
  .mt-opt:hover { border-color: var(--accent); }
  .mt-opt.selected { background: var(--primary-light); border-color: var(--primary); font-weight: 500; }
  .mt-opt.correct { background: var(--success-bg) !important; border-color: var(--success) !important; color: var(--success); }
  .mt-opt.wrong { background: var(--danger-bg) !important; border-color: var(--danger) !important; color: var(--danger); }
  .mt-exp {
    display: none;
    margin-top: 0.6rem;
    padding: 0.6rem 0.8rem;
    border-radius: 6px;
    background: var(--surface-alt);
    font-size: 0.84rem;
    border-left: 3px solid var(--accent);
  }
  .mt-exp.show { display: block; }
  .mt-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin-top: 1rem; }
  .mt-score { font-weight: 700; font-size: 0.95rem; color: var(--primary); }

  /* Flashcards grid */
  .fc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1rem;
    margin-top: 1.25rem;
  }
  .fc-card {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-top: 4px solid var(--accent);
    border-radius: 10px;
    padding: 1rem 1.1rem;
  }
  .fc-card h4 { margin: 0 0 0.55rem; color: var(--primary); font-size: 0.98rem; }
  .fc-card ul { margin: 0; padding-left: 1.15rem; font-size: 0.87rem; }
  .fc-card li { margin-bottom: 0.35rem; }

  .tema-footer-nav {
    display: flex;
    justify-content: space-between;
    gap: 0.75rem;
    margin-top: 2.2rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--border);
  }
  .nav-btn {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.68rem 1.05rem;
    font-weight: 600;
    font-size: 0.86rem;
    cursor: pointer;
  }
  .nav-btn.secondary {
    background: var(--surface-alt);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 140;
  }
  .overlay.show { display: block; }

  @media (max-width: 860px) {
    #menuBtn { display: inline-flex; }
    aside.sidebar { transform: translateX(-100%); width: 85%; max-width: 320px; }
    aside.sidebar.open { transform: translateX(0); }
    main.content { margin-left: 0; padding: 1rem 0.7rem 4rem; }
    .article-wrap { padding: 1.3rem 1rem; border-radius: 10px; }
    h1.tema-title { font-size: 1.25rem; }
    .brand span.hide-mobile { display: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <button class="icon-btn" id="menuBtn" onclick="toggleSidebar()">☰ Menú</button>
    <span>Ayto. Huelva <span class="hide-mobile">· Portero/a-Mantenedor/a</span></span>
    <span class="tag">Edición V2</span>
  </div>
  <div class="top-actions">
    <button class="icon-btn" onclick="changeFontSize(-1)" title="Reducir letra">A-</button>
    <button class="icon-btn" onclick="changeFontSize(1)" title="Aumentar letra">A+</button>
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙 Oscuro</button>
  </div>
</header>
<div class="read-progress" id="readProgress"></div>
<div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <input type="text" class="search-box" id="searchInput" placeholder="🔍 Buscar en los 12 temas..." oninput="renderSidebar(this.value)">
    <div class="progress-summary">
      <div style="display:flex;justify-content:space-between;font-weight:700;">
        <span>Progreso de estudio</span>
        <span id="progressText">0 / 12</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    </div>
    <button class="flashcards-nav-btn" id="fcNavBtn" onclick="showFlashcards()">
      <span>⚡ Fichas de Memoria Rápida</span>
      <span>Repaso</span>
    </button>
    <div id="navContainer"></div>
  </aside>

  <main class="content">
    <div class="article-wrap" id="articleContainer"></div>
  </main>
</div>

<script>
const TEMARIO = [
  {
    id: 1,
    bloque: "Bloque I · Jurídico",
    titulo: "Tema 1. La Constitución Española de 1978. El Estatuto de Autonomía de Andalucía. El Régimen Local español",
    html: `
      <h2>1. La Constitución Española de 1978: Principios generales, estructura y contenido</h2>
      <ul>
        <li><strong>Cronología oficial:</strong> Aprobada por las Cortes Generales el <strong>31 de octubre de 1978</strong>; ratificada en referéndum el <strong>6 de diciembre de 1978</strong>; sancionada y promulgada por el Rey el <strong>27 de diciembre de 1978</strong>; publicada en el BOE y entrada en vigor el <strong>29 de diciembre de 1978</strong>.</li>
        <li><strong>Estructura formal:</strong> Preámbulo (sin fuerza normativa directa, valor interpretativo) + <strong>169 artículos</strong> (Título Preliminar + 10 Títulos) + 4 Disposiciones Adicionales, 9 Transitorias, 1 Derogatoria y 1 Final.</li>
      </ul>
      <table>
        <thead><tr><th>Título</th><th>Contenido</th><th>Artículos</th></tr></thead>
        <tbody>
          <tr><td>Preliminar</td><td>Principios generales y valores superiores</td><td>Arts. 1 a 9</td></tr>
          <tr><td>Título I</td><td>De los derechos y deberes fundamentales</td><td>Arts. 10 a 55</td></tr>
          <tr><td>Título II</td><td>De la Corona</td><td>Arts. 56 a 65</td></tr>
          <tr><td>Título III</td><td>De las Cortes Generales (Congreso y Senado)</td><td>Arts. 66 a 96</td></tr>
          <tr><td>Título IV</td><td>Del Gobierno y de la Administración</td><td>Arts. 97 a 107</td></tr>
          <tr><td>Título V</td><td>Relaciones entre Gobierno y Cortes Generales</td><td>Arts. 108 a 116</td></tr>
          <tr><td>Título VI</td><td>Del Poder Judicial</td><td>Arts. 117 a 127</td></tr>
          <tr><td>Título VII</td><td>Economía y Hacienda</td><td>Arts. 128 a 136</td></tr>
          <tr><td>Título VIII</td><td>De la Organización Territorial del Estado</td><td>Arts. 137 a 158</td></tr>
          <tr><td>Título IX</td><td>Del Tribunal Constitucional</td><td>Arts. 159 a 165</td></tr>
          <tr><td>Título X</td><td>De la reforma constitucional</td><td>Arts. 166 a 169</td></tr>
        </tbody>
      </table>
      <ul>
        <li><strong>Artículos esenciales del Título Preliminar:</strong>
          <ul>
            <li><strong>Art. 1:</strong> España se constituye en un <strong>Estado social y democrático de Derecho</strong>, que propugna como valores superiores la <strong>libertad, la justicia, la igualdad y el pluralismo político</strong>. La soberanía nacional reside en el pueblo español. Forma política: <strong>Monarquía parlamentaria</strong>.</li>
            <li><strong>Art. 2:</strong> Indisoluble unidad de la Nación española y derecho a la autonomía de nacionalidades y regiones y solidaridad entre todas ellas.</li>
            <li><strong>Art. 3:</strong> El castellano es la lengua española oficial del Estado (deber de conocerla y derecho a usarla).</li>
            <li><strong>Art. 4:</strong> Bandera: tres franjas horizontales, roja, amarilla y roja, siendo la <strong>amarilla de doble anchura</strong> que cada una de las rojas.</li>
            <li><strong>Art. 5:</strong> La capital del Estado es la villa de Madrid.</li>
            <li><strong>Art. 9.3:</strong> Garantiza legalidad, jerarquía normativa, publicidad de normas, irretroactividad de disposiciones sancionadoras no favorables o restrictivas de derechos individuales, seguridad jurídica, responsabilidad e interdicción de la arbitrariedad.</li>
          </ul>
        </li>
      </ul>

      <h2>2. El Estatuto de Autonomía para Andalucía: Título Preliminar y Disposiciones Generales</h2>
      <ul>
        <li><strong>Ley Orgánica 2/2007, de 19 de marzo</strong> (250 artículos: Título Preliminar + 10 Títulos).</li>
        <li><strong>Art. 2 (Territorio):</strong> Comprende los municipios de las 8 provincias: Almería, Cádiz, Córdoba, Granada, <strong>Huelva</strong>, Jaén, Málaga y Sevilla.</li>
        <li><strong>Art. 3 (Símbolos y Día):</strong> Bandera verde, blanca y verde de igual anchura (Asamblea de Ronda 1918); escudo con leyenda <em>"Andalucía por sí, para España y la Humanidad"</em>; himno con letra de Blas Infante y música de José del Castillo; <strong>Día de Andalucía: 28 de febrero</strong>.</li>
        <li><strong>Art. 4 (Capitalidad y sedes):</strong> Capital en <strong>Sevilla</strong> (sede del Parlamento, Presidencia y Consejo de Gobierno). Sede del Tribunal Superior de Justicia de Andalucía (TSJA) en <strong>Granada</strong>.</li>
        <li><strong>Art. 5 (Condición de andaluz/a):</strong> Ciudadanos españoles con <strong>vecindad administrativa</strong> en cualquier municipio de Andalucía.</li>
      </ul>

      <h2>3. El Régimen Local español. Principios constitucionales y regulación jurídica</h2>
      <ul>
        <li><strong>Art. 140 CE:</strong> Garantiza la autonomía de los municipios, que gozan de <strong>personalidad jurídica plena</strong>. Gobierno y administración a cargo de los Ayuntamientos (Alcaldes y Concejales).</li>
        <li><strong>Art. 141 CE:</strong> Provincia como entidad local con <strong>personalidad jurídica propia</strong> (Diputaciones).</li>
        <li><strong>Ley 7/1985, de 2 de abril (LBRL), art. 3:</strong>
          <ul>
            <li><em>Entidades Locales territoriales (necesarias):</em> El <strong>Municipio</strong>, la <strong>Provincia</strong> y la <strong>Isla</strong> en los archipiélagos balear y canario.</li>
            <li><em>Otras Entidades Locales (potestativas):</em> Comarcas, Áreas Metropolitanas y Mancomunidades de Municipios.</li>
          </ul>
        </li>
      </ul>
    `,
    quiz: [
      { q: "¿En qué fecha entró en vigor la Constitución Española de 1978?", opts: ["6 de diciembre de 1978.", "27 de diciembre de 1978.", "29 de diciembre de 1978.", "31 de octubre de 1978."], ans: 2, exp: "Se publicó en el BOE y entró en vigor el mismo día 29 de diciembre de 1978." },
      { q: "Según el art. 4 CE, en la bandera de España la franja amarilla tiene:", opts: ["La misma anchura que las rojas.", "Doble anchura que cada una de las rojas.", "Triple anchura que las rojas.", "La mitad de anchura que las rojas."], ans: 1, exp: "Art. 4.1 CE: la amarilla es de doble anchura que cada una de las rojas." },
      { q: "¿Dónde tiene su sede el Tribunal Superior de Justicia de Andalucía (TSJA)?", opts: ["Sevilla.", "Málaga.", "Granada.", "Córdoba."], ans: 2, exp: "Art. 4.2 Estatuto de Autonomía: la sede del TSJA radica en Granada (Sevilla es la capital)." },
      { q: "Según el art. 140 CE, los municipios gozan de:", opts: ["Personalidad jurídica plena.", "Personalidad jurídica propia.", "Personalidad jurídica derivada.", "Carecen de personalidad jurídica."], ans: 0, exp: "El municipio tiene personalidad jurídica plena (art. 140 CE) y la provincia propia (art. 141 CE)." },
      { q: "¿Cuál de las siguientes NO es una entidad local territorial necesaria del art. 3.1 LBRL?", opts: ["El Municipio.", "La Provincia.", "La Mancomunidad de Municipios.", "La Isla en los archipiélagos balear y canario."], ans: 2, exp: "Las mancomunidades, comarcas y áreas metropolitanas están en el art. 3.2 LBRL." }
    ]
  },
  {
    id: 2,
    bloque: "Bloque I · Jurídico",
    titulo: "Tema 2. El Procedimiento Administrativo Común (Ley 39/2015) y el Régimen Jurídico del Sector Público (Ley 40/2015)",
    html: `
      <h2>1. Ley 39/2015 (LPACAP): Ámbito de aplicación e interesados</h2>
      <ul>
        <li><strong>Ámbito subjetivo (art. 2):</strong> Se aplica al <strong>Sector Público</strong>:
          <ol>
            <li>Administración General del Estado (AGE).</li>
            <li>Administraciones de las Comunidades Autónomas.</li>
            <li>Entidades que integran la Administración Local.</li>

      { q: "¿Dónde se encuentra la Casa Consistorial del Ayuntamiento de Huelva?", opts: ["Plaza de las Monjas.", "Plaza de la Constitución, s/n.", "Plaza del Punto.", "Avenida de Andalucía."], ans: 1, exp: "Plaza de la Constitución, s/n, 21071 Huelva." },
      { q: "¿Qué empresa municipal gestiona los autobuses urbanos en Huelva?", opts: ["Aguas de Huelva.", "EMTUSA.", "EMVISMAN.", "DAMAS."], ans: 1, exp: "EMTUSA (Empresa Municipal de Transportes Urbanos, S.A.)." },
      { q: "¿A quién corresponde la conservación, mantenimiento y vigilancia de los edificios de CEIP públicos?", opts: ["Al Ayuntamiento (art. 25.2.n LBRL).", "Al Ministerio de Defensa.", "A la Diputación exclusivamente.", "A los propios alumnos."], ans: 0, exp: "Art. 25.2.n LBRL y DA 15.ª LOE." }
    ]
  }
];

const FLASHCARDS_DATA = [
  { title: "📅 Fechas y Plazos Clave", items: ["CE 1978: Aprobada 31/10 · Referéndum 6/12 · Sanción 27/12 · BOE/Vigor 29/12.", "Estatuto Andalucía: LO 2/2007 (19 marzo) · Día Andalucía: 28 febrero.", "Subsanación representación (Ley 39/2015): 10 días.", "Recusación (Ley 40/2015): Recusado contesta día siguiente; superior resuelve en 3 días.", "Videovigilancia (LOPDGDD): Borrado máx. 1 mes; entrega autoridad máx. 72 h.", "Notificación papel (art. 42.2): 2.º intento en hora distinta dentro de los 3 días siguientes."] },
  { title: "⚖️ Grados, Leyes y Tributos", items: ["Abstención parentesco: 4.º consanguinidad / 2.º afinidad; servicios últimos 2 años.", "Impuestos municipales obligatorios (3): IBI, IAE, IVTM.", "Impuestos municipales potestativos (2): ICIO y Plusvalía (IIVTNU).", "Ley LGTBI: Estatal Ley 4/2023 · Andalucía Ley 8/2017.", "Puesto Portero-Mantenedor: Admin. Especial, Subescala Subalterna, Grupo AP."] },
  { title: "🌡️ Cifras Técnicas y Oficina", items: ["Climatización (RDL 14/2022): Máx. 19 °C calefacción / Mín. 27 °C refrigeración.", "DIN A4: 210 x 297 mm (80 g/m²) · A3: 297 x 420 mm · A5: 148 x 210 mm.", "Escalas fotocopia: A3 -> A4 = 71 % | A4 -> A3 = 141 %.", "Teléfono: Descolgar < 3.º tono · Retomar espera cada 20-30 s · Cuelga 1.º ciudadano.", "Zona social atención presencial: 1,20 m a 3,60 m (No verbal > 65 %)."] },
  { title: "🔌 Electricidad, Sonido y PRL", items: ["Tensión España: 230 V monofásica / 400 V trifásica.", "Colores cables: Neutro Azul claro · Tierra Verde-Amarillo · Fase Negro/Marrón/Gris.", "Micrófono condensador: +48 V Phantom · Conector balanceado: XLR · Líneas: 100 V.", "Escalera apoyo: 75° (regla 1:4) + sobresalir 1 m · Tijera: no pisar 2 últimos peldaños.", "Fuegos: A (sólidos), B (líquidos), C (gases), D (metales), F (aceites). Eléctricos: CO2."] },
  { title: "🏛️ Ayuntamiento de Huelva", items: ["Régimen: Municipio de Gran Población (Título X LBRL).", "Pleno: Alcalde + 27 Concejales · Sede: Plaza de la Constitución, s/n.", "Empresas: EMTUSA (bus), Aguas de Huelva, Huelva Deporte, EMVISMAN, Huelva TV.", "Equipamientos: Gran Teatro (Vázquez López), Casa Colón (Plaza Punto), Mercados Carmen y S. Sebastián.", "Examen BOP: 100 preguntas · 60 min · +0,10 acierto / -0,025 fallo (4:1) · Corte 5,00."] }
];

let currentMode = 'tema';
let currentId = 1;
let studiedSet = new Set(JSON.parse(localStorage.getItem('huelva_pm_studied_v2') || '[]'));
let fontScale = 100;
let mtAnswers = {};
let mtGraded = false;

function saveStudied() {
  localStorage.setItem('huelva_pm_studied_v2', JSON.stringify([...studiedSet]));
  updateProgressUI();
}

function updateProgressUI() {
  const count = studiedSet.size;
  document.getElementById('progressText').textContent = `${count} / ${TEMARIO.length}`;
  document.getElementById('progressFill').style.width = `${(count / TEMARIO.length) * 100}%`;
}

function renderSidebar(filterText = '') {
  const container = document.getElementById('navContainer');
  container.innerHTML = '';
  const query = filterText.trim().toLowerCase();
  document.getElementById('fcNavBtn').classList.toggle('active', currentMode === 'flashcards');

  let currentBloque = '';
  TEMARIO.forEach(t => {
    const plainText = (t.titulo + ' ' + t.html.replace(/<[^>]+>/g, ' ')).toLowerCase();
    if (query && !plainText.includes(query)) return;

    if (t.bloque !== currentBloque) {
      currentBloque = t.bloque;
      const gTitle = document.createElement('div');
      gTitle.className = 'nav-group-title';
      gTitle.textContent = currentBloque;
      container.appendChild(gTitle);
    }

    const item = document.createElement('div');
    item.className = 'nav-item' + (currentMode === 'tema' && t.id === currentId ? ' active' : '');
    item.onclick = () => {
      selectTema(t.id);
      if (window.innerWidth <= 860) toggleSidebar(false);
    };
    item.innerHTML = `
      <span>${t.titulo}</span>
      <span class="nav-check">${studiedSet.has(t.id) ? '✔' : ''}</span>
    `;
    container.appendChild(item);
  });
}

function showFlashcards() {
  currentMode = 'flashcards';
  const article = document.getElementById('articleContainer');
  article.innerHTML = `
    <div class="tema-header">
      <div class="tema-meta"><span class="tema-badge">Repaso Express · Datos Clave</span></div>
      <h1 class="tema-title">⚡ Fichas de Memoria Rápida (Los 12 Temas)</h1>
    </div>
    <p>Resumen concentrado de fechas, cifras, leyes, protocolos y datos del Ayuntamiento de Huelva para repasar los últimos días antes del examen.</p>
    <div class="fc-grid">
      ${FLASHCARDS_DATA.map(fc => `
        <div class="fc-card">
          <h4>${fc.title}</h4>
          <ul>${fc.items.map(i => `<li>${i}</li>`).join('')}</ul>
        </div>
      `).join('')}
    </div>
    <div class="tema-footer-nav">
      <button class="nav-btn" onclick="selectTema(1)">Ir al Tema 1 &rarr;</button>
    </div>
  `;
  renderSidebar(document.getElementById('searchInput').value);
  if (window.innerWidth <= 860) toggleSidebar(false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectTema(id) {
  currentMode = 'tema';
  currentId = id;
  mtAnswers = {};
  mtGraded = false;
  const tema = TEMARIO.find(t => t.id === id);
  if (!tema) return;

  const isDone = studiedSet.has(id);
  const letters = ['A', 'B', 'C', 'D'];
  const article = document.getElementById('articleContainer');
  article.innerHTML = `
    <div class="tema-header">
      <div class="tema-meta">
        <span class="tema-badge">${tema.bloque}</span>
        <button class="study-toggle ${isDone ? 'done' : ''}" onclick="toggleStudied(${id})">
          ${isDone ? '✔ Tema estudiado' : '○ Marcar como estudiado'}
        </button>
      </div>
      <h1 class="tema-title">${tema.titulo}</h1>
    </div>
    <div class="tema-body">${tema.html}</div>

    <div class="minitest-box">
      <div class="minitest-header">
        <h3>📝 Mini-Test de Autoevaluación (5 preguntas)</h3>
        <span class="mt-score" id="mtScore"></span>
      </div>
      ${tema.quiz.map((q, qIdx) => `
        <div class="mt-q">
          <div class="mt-q-text">${qIdx + 1}. ${q.q}</div>
          <div class="mt-opts" id="mt-opts-${qIdx}">
            ${q.opts.map((o, oIdx) => `
              <div class="mt-opt" id="mt-opt-${qIdx}-${oIdx}" onclick="selectMtOpt(${qIdx}, ${oIdx})">
                <strong>${letters[oIdx]})</strong> <span>${o}</span>
              </div>
            `).join('')}
          </div>
          <div class="mt-exp" id="mt-exp-${qIdx}"><strong>Explicación:</strong> ${q.exp}</div>
        </div>
      `).join('')}
      <div class="mt-actions">
        <button class="nav-btn" onclick="gradeMiniTest()">Comprobar respuestas</button>
        <button class="nav-btn secondary" onclick="selectTema(${id})">Reiniciar mini-test</button>
      </div>
    </div>

    <div class="tema-footer-nav">
      <button class="nav-btn secondary" ${id === 1 ? 'disabled' : ''} onclick="selectTema(${id - 1})">&larr; Tema anterior</button>
      <button class="nav-btn" ${id === TEMARIO.length ? 'disabled' : ''} onclick="selectTema(${id + 1})">Tema siguiente &rarr;</button>
    </div>
  `;

  renderSidebar(document.getElementById('searchInput').value);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectMtOpt(qIdx, oIdx) {
  if (mtGraded) return;
  mtAnswers[qIdx] = oIdx;
  document.querySelectorAll(`#mt-opts-${qIdx} .mt-opt`).forEach((el, i) => {
    el.classList.toggle('selected', i === oIdx);
  });
}

function gradeMiniTest() {
  if (mtGraded) return;
  const tema = TEMARIO.find(t => t.id === currentId);
  if (!tema) return;
  mtGraded = true;
  let ok = 0;
  tema.quiz.forEach((q, qIdx) => {
    const chosen = mtAnswers[qIdx];
    document.getElementById(`mt-opt-${qIdx}-${q.ans}`).classList.add('correct');
    if (chosen === q.ans) ok++;
    else if (chosen !== undefined) document.getElementById(`mt-opt-${qIdx}-${chosen}`).classList.add('wrong');
    document.getElementById(`mt-exp-${qIdx}`).classList.add('show');
  });
  document.getElementById('mtScore').textContent = `Resultado: ${ok} / ${tema.quiz.length} aciertos`;
}

function toggleStudied(id) {
  if (studiedSet.has(id)) studiedSet.delete(id);
  else studiedSet.add(id);
  saveStudied();
  selectTema(id);
}

function toggleSidebar(force) {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('overlay');
  const open = force !== undefined ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  ov.classList.toggle('show', open);
}

function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '🌙 Oscuro' : '☀️ Claro';
  localStorage.setItem('huelva_pm_theme', isDark ? 'light' : 'dark');
}

function changeFontSize(delta) {
  fontScale = Math.min(130, Math.max(85, fontScale + delta * 8));
  document.getElementById('articleContainer').style.fontSize = fontScale + '%';
}

window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
  document.getElementById('readProgress').style.width = pct + '%';
});

if (localStorage.getItem('huelva_pm_theme') === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
  document.getElementById('themeBtn').textContent = '☀️ Claro';
}

updateProgressUI();
selectTema(1);
</script>
</body>
</html>
